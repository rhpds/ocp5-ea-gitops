---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s4-data
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s4-config
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  S3_ENDPOINT: "http://localhost:7480"
  S3_REGION: "us-east-1"
  SERVER_PORT: "5000"
  SERVER_IP: "0.0.0.0"
  STORAGE_MAX_FILE_SIZE_GB: "5"
  STORAGE_MAX_CONCURRENT_TRANSFERS: "2"
  AUTH_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s4
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: s4
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: s4
        image: quay.io/rh-aiservices-bu/s4:latest
        imagePullPolicy: Always
        ports:
        - name: s3-api
          containerPort: 7480
        - name: web-ui
          containerPort: 5000
        envFrom:
        - configMapRef:
            name: s4-config
        - secretRef:
            name: s4-credentials
        volumeMounts:
        - name: s4-data
          mountPath: /var/lib/ceph/radosgw
        readinessProbe:
          httpGet:
            path: /api
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: s4-data
        persistentVolumeClaim:
          claimName: s4-data
---
apiVersion: v1
kind: Service
metadata:
  name: s4
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: ClusterIP
  ports:
  - port: 7480
    targetPort: 7480
    protocol: TCP
    name: s3-api
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: web-ui
  selector:
    app: s4
---
apiVersion: v1
kind: Secret
metadata:
  name: s4-credentials
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s4.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s4.accessKeySecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s4.tempoSecretName }}
  namespace: {{ .Values.tempo.namespace }}
  labels:
    app: s4
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  bucket: {{ .Values.s4.bucketName }}
  endpoint: {{ .Values.s4.endpoint }}
  access_key_id: {{ .Values.s4.accessKeyId }}
  access_key_secret: {{ .Values.s4.accessKeySecret }}

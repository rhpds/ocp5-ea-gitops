---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: {{ .Release.Namespace }}
data:
  config.toml: |
    toolsets = [{{- range $i, $t := .Values.toolsets }}{{- if $i }},{{ end }}"{{ $t }}"{{- end }}]
    log_level = 0
    port = "8080"
    read_only = false
    cluster_auth_mode = "passthrough"
    require_oauth = true
    authorization_url = "https://sso.{{ .Values.clusterSubdomain }}/realms/{{ .Values.keycloak.realm }}"
    oauth_audience = "{{ .Values.keycloak.clientId }}"
    server_url = "https://mcp-server.{{ .Values.clusterSubdomain }}"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-server-keycloak-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: mcp-server-keycloak-setup
    spec:
      serviceAccountName: keycloak-mcp-server-setup
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eo pipefail

              REALM="{{ .Values.keycloak.realm }}"
              CLIENT_ID="{{ .Values.keycloak.clientId }}"
              CLIENT_SECRET="{{ .Values.keycloak.clientSecret }}"

              SSO_URL="https://sso.{{ .Values.clusterSubdomain }}"
              echo "Keycloak URL: ${SSO_URL}"

              # Get admin credentials from secret
              ADMIN_USER=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}' | base64 -d)
              ADMIN_PASS=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}' | base64 -d)

              # Get admin token
              ADMIN_TOKEN=$(curl -sk -X POST "${SSO_URL}/realms/master/protocol/openid-connect/token" \
                -d "grant_type=password&client_id=admin-cli&username=${ADMIN_USER}&password=${ADMIN_PASS}" | \
                python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

              # Create MCP server client if it doesn't exist
              EXISTING=$(curl -sk "${SSO_URL}/admin/realms/${REALM}/clients?clientId=${CLIENT_ID}" \
                -H "Authorization: Bearer ${ADMIN_TOKEN}" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
              if [ "$EXISTING" = "0" ]; then
                echo "Creating client ${CLIENT_ID}..."
                curl -sk -X POST "${SSO_URL}/admin/realms/${REALM}/clients" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"clientId\":\"${CLIENT_ID}\",\"enabled\":true,\"publicClient\":true,\"directAccessGrantsEnabled\":true,\"standardFlowEnabled\":true,\"protocol\":\"openid-connect\",\"redirectUris\":[\"https://mcp-server.{{ .Values.clusterSubdomain }}/*\",\"http://localhost/*\",\"http://127.0.0.1/*\"],\"webOrigins\":[\"*\"],\"attributes\":{\"pkce.code.challenge.method\":\"S256\"}}"
                echo "Client created"
              else
                echo "Client ${CLIENT_ID} already exists"
              fi

              # Update trusted hosts policy for dynamic client registration
              COMP_ID=$(curl -sk "${SSO_URL}/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy" \
                -H "Authorization: Bearer ${ADMIN_TOKEN}" | python3 -c "
              import sys, json
              for c in json.load(sys.stdin):
                  if c['providerId'] == 'trusted-hosts':
                      print(c['id']); break
              ")
              if [ -n "$COMP_ID" ]; then
                echo "Updating trusted hosts policy..."
                curl -sk -X PUT "${SSO_URL}/admin/realms/${REALM}/components/${COMP_ID}" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"${COMP_ID}\",\"name\":\"Trusted Hosts\",\"providerId\":\"trusted-hosts\",\"providerType\":\"org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy\",\"parentId\":\"${REALM}\",\"config\":{\"host-sending-registration-request-must-match\":[\"true\"],\"trusted-hosts\":[\"mcp-server.{{ .Values.clusterSubdomain }}\",\"localhost\",\"127.0.0.1\"],\"client-uris-must-match\":[\"true\"]}}"
                echo "Trusted hosts updated"
              fi

              # Create users
              {{- range .Values.keycloak.users }}
              EXISTING=$(curl -sk "${SSO_URL}/admin/realms/${REALM}/users?username={{ .username }}&exact=true" \
                -H "Authorization: Bearer ${ADMIN_TOKEN}" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
              if [ "$EXISTING" = "0" ]; then
                echo "Creating user {{ .username }}..."
                curl -sk -X POST "${SSO_URL}/admin/realms/${REALM}/users" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{"username":"{{ .username }}","enabled":true,"emailVerified":true,"email":"{{ .email }}","firstName":"{{ .firstName }}","lastName":"{{ .lastName }}","credentials":[{"type":"password","value":"{{ .password }}","temporary":false}]}'
                echo "User {{ .username }} created"
              else
                echo "User {{ .username }} already exists"
              fi
              {{- end }}

              echo "MCP server Keycloak setup complete"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-mcp-server-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-mcp-server-setup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-initial-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-mcp-server-setup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: keycloak-mcp-server-setup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: keycloak-mcp-server-setup
  apiGroup: rbac.authorization.k8s.io

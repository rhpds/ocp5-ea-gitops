{{- $existing := lookup "v1" "Secret" .Release.Namespace "mcp-user-credentials" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-user-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  {{- range .Values.users }}
  {{- $key := .username }}
  {{- $existingVal := "" }}
  {{- if $existing }}
  {{- $existingVal = index $existing.data $key }}
  {{- end }}
  {{ $key }}: {{ $existingVal | default (randAlphaNum 16 | b64enc) }}
  {{- end }}

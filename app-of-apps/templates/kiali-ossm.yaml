{{- if .Values.kialiOssm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.kialiOssm.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.kialiOssm.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kiali-ossm
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        subscription:
          source: redhat-operators
        tempo:
          subscription:
            source: {{ .Values.catalogSource.name }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
